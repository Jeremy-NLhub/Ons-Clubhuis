
<!doctype html>
<html lang="nl">
<head>
<meta charset="utf-8">
<meta name="viewport"
content="width=device-width,initial-scale=1">
<title>Karina – Wachtwoord herstellen</title>
<style>
*{box-sizing:border-box}
body{
  margin:0;
  background:#171121;
  color:#fff;
  font-family:system-ui,Arial;
  padding:22px
}
main{
  max-width:440px;
  margin:45px auto;
  background:#30243e;
  padding:25px;
  border-radius:20px
}
h1{font-size:25px}
p{line-height:1.5;color:#ddd1ed}
label{display:block;margin-top:16px}
input,button{
  width:100%;
  padding:14px;
  border:0;
  border-radius:10px;
  font:inherit;
  margin-top:7px
}
input{background:#fff;color:#222}
button{
  background:#ad82ed;
  color:#1b1025;
  font-weight:700;
  margin-top:18px;
  cursor:pointer
}
button:disabled{opacity:.5}
#status{margin-top:18px;white-space:pre-wrap}
a{color:#dfc4ff}
</style>
</head>
<body>
<main>
<h1>💜 Karina's wachtwoord</h1>
<p>
Alleen Jeremy kan hier Karina's
wachtwoord wijzigen.
</p>

<section id="loginSection">
<label for="email">Jeremy's e-mailadres</label>
<input id="email" type="email"
autocomplete="username">

<label for="loginPassword">Jeremy's wachtwoord</label>
<input id="loginPassword" type="password"
autocomplete="current-password">

<button id="loginButton">Inloggen als Jeremy</button>
</section>

<section id="resetSection" hidden>
<p>Ingelogd als <strong id="account"></strong></p>

<label for="newPassword">
Nieuw wachtwoord voor Karina
</label>
<input id="newPassword"
type="password"
autocomplete="new-password"
minlength="12">

<label for="confirmPassword">
Herhaal het nieuwe wachtwoord
</label>
<input id="confirmPassword"
type="password"
autocomplete="new-password"
minlength="12">

<button id="resetButton">
Karina's wachtwoord wijzigen
</button>

<button id="logoutButton" type="button">
Uitloggen
</button>
</section>

<div id="status" role="status"></div>

<p><a href="./">Terug naar Ons Clubhuis</a></p>
</main>

<script type="module">
import {createClient}
from "https://esm.sh/@supabase/supabase-js@2";

const supabase=createClient(
  "https://crfvjukxqkgmvfjqmhza.supabase.co",
  "sb_publishable_CWrMrWdu4c4T6yJsspklSQ_FLg2y-f4",
  {
    auth:{
      persistSession:false,
      autoRefreshToken:false
    }
  }
);

const $=id=>document.getElementById(id);
let session=null;

function status(text){
  $("status").textContent=text;
}

$("loginButton").onclick=async()=>{
  $("loginButton").disabled=true;
  status("Inloggen...");

  try{
    const {data,error}=
      await supabase.auth.signInWithPassword({
        email:$("email").value.trim(),
        password:$("loginPassword").value
      });

    if(error)throw error;

    session=data.session;

    if(!session){
      throw new Error("Geen geldige sessie");
    }

    $("loginPassword").value="";
    $("account").textContent=data.user.email||"Jeremy";
    $("loginSection").hidden=true;
    $("resetSection").hidden=false;
    status("Ingelogd. Kies Karina's nieuwe wachtwoord.");
  }catch(error){
    status("Inloggen mislukt: "+error.message);
  }finally{
    $("loginButton").disabled=false;
  }
};

$("resetButton").onclick=async()=>{
  const password=$("newPassword").value;
  const confirm=$("confirmPassword").value;

  if(password.length<12||password.length>128){
    status("Gebruik een wachtwoord van 12 tot 128 tekens.");
    return;
  }

  if(password!==confirm){
    status("De wachtwoorden zijn niet gelijk.");
    return;
  }

  if(!session?.access_token){
    status("Log eerst in als Jeremy.");
    return;
  }

  $("resetButton").disabled=true;
  status("Wachtwoord wijzigen...");

  try{
    const response=await fetch(
      "https://crfvjukxqkgmvfjqmhza.supabase.co/functions/v1/super-handler",
      {
        method:"POST",
        headers:{
          "Authorization":"Bearer "+session.access_token,
          "apikey":"sb_publishable_CWrMrWdu4c4T6yJsspklSQ_FLg2y-f4",
          "Content-Type":"application/json"
        },
        body:JSON.stringify({password})
      }
    );

    const result=await response.json();

    if(!response.ok||!result.success){
      throw new Error(
        result.error||"Wachtwoord wijzigen mislukt"
      );
    }

    $("newPassword").value="";
    $("confirmPassword").value="";

    status(
      "✅ Gelukt! Karina kan nu met haar nieuwe wachtwoord inloggen."
    );

  }catch(error){
    status("❌ "+error.message);
  }finally{
    $("resetButton").disabled=false;
  }
};

$("logoutButton").onclick=async()=>{
  await supabase.auth.signOut();
  session=null;
  $("resetSection").hidden=true;
  $("loginSection").hidden=false;
  status("Uitgelogd.");
};
</script>
</body>
</html>
