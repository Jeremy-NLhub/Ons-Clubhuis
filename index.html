
<!doctype html>
<html lang="nl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Ons Clubhuis 💜</title>
<style>
:root{
  font-family:system-ui,Arial;
  color:#f7f3ff;
  background:#151120
}
*{box-sizing:border-box}
body{margin:0}
main{
  max-width:760px;
  margin:auto;
  height:100dvh;
  display:flex;
  flex-direction:column
}
header{
  background:#30243e;
  padding:17px 20px
}
h1{font-size:23px;margin:0}
small{color:#d2c7db}
#auth{
  margin:10vh auto;
  padding:25px;
  max-width:400px;
  width:94%;
  background:#30243e;
  border-radius:18px
}
input,button{
  font:inherit;
  border-radius:10px;
  padding:13px;
  border:0
}
input{
  width:100%;
  margin:7px 0;
  background:#fff;
  color:#21182b
}
button{
  cursor:pointer;
  background:#a781e8;
  color:#1a1025;
  font-weight:700
}
#auth button{width:100%;margin-top:10px}
#chat{
  display:none;
  flex:1;
  min-height:0;
  flex-direction:column
}
#messages{
  overflow:auto;
  flex:1;
  padding:16px;
  display:flex;
  flex-direction:column;
  gap:12px
}
.msg{
  max-width:85%;
  padding:12px 15px;
  border-radius:16px;
  background:#382e45;
  align-self:flex-start;
  overflow-wrap:anywhere
}
.mine{
  align-self:flex-end;
  background:#63458c
}
.name{
  font-size:12px;
  color:#e5c9ff;
  margin-bottom:4px
}
form{
  display:flex;
  gap:8px;
  padding:12px;
  background:#30243e
}
form input{
  margin:0;
  flex:1;
  min-width:0
}
#notice{
  padding:8px 15px;
  color:#ffcfaf;
  font-size:13px;
  min-height:28px
}
#logout{
  float:right;
  padding:7px 10px;
  background:#ddd
}
footer{
  padding:5px 14px;
  font-size:11px;
  color:#bfb3cc
}
#bots{
  padding:12px 15px;
  color:#d2c7db;
  font-size:13px;
  background:#211a2d
}
.botbar{
  display:flex;
  gap:8px;
  flex-wrap:wrap;
  margin-top:9px
}
.botpill{
  background:#49345f;
  color:#fff;
  border:1px solid #765a95;
  border-radius:20px;
  padding:8px 11px;
  font-size:12px
}
.botpill:focus-visible{
  outline:2px solid white
}
.botmsg{background:#2e3c58}
.botmsg.karina{background:#493044}
.hint{
  font-size:11px;
  color:#d2c7db;
  margin-top:7px
}
</style>
</head>
<body>
<main>
<header>
<button id="logout" hidden>Uitloggen</button>
<h1>💜 Ons Clubhuis</h1>
<small>Jeremy • Karina • 2 AI-personages</small>
</header>

<section id="auth">
<h2>Welkom terug 👋</h2>
<p>Log in met het account dat voor jou in Supabase is aangemaakt.</p>
<input id="email" type="email" placeholder="E-mailadres" autocomplete="username">
<input id="password" type="password" placeholder="Wachtwoord" autocomplete="current-password">
<button id="login">Inloggen</button>
</section>

<section id="chat">
<div id="bots">
🤖 <strong>Onze AI-vrienden</strong>
<div class="botbar">
<button type="button" class="botpill" data-mention="@Chat ">
🤖 Chat van Jeremy
</button>
<button type="button" class="botpill" data-mention="@KarinasChat ">
❤️ Chat van Karina
</button>
</div>
<div class="hint">
Tik op een naam om die te noemen. Automatische AI-antwoorden zijn nog niet aangesloten.
</div>
</div>

<div id="messages"></div>

<form id="send">
<input id="message" maxlength="4000" placeholder="Typ een bericht..." required>
<button>Verstuur</button>
</form>
</section>

<div id="notice" role="status"></div>
<footer>Alleen goedgekeurde leden kunnen berichten lezen en sturen.</footer>
</main>

<script type="module">
import {createClient} from 'https://esm.sh/@supabase/supabase-js@2';

const supabase=createClient(
'https://crfvjukxqkgmvfjqmhza.supabase.co',
'sb_publishable_CWrMrWdu4c4T6yJsspklSQ_FLg2y-f4'
);

const $=id=>document.getElementById(id);
let user=null,timer=null;

function note(s){
  $('notice').textContent=s||'';
}

function render(items){
  let pane=$('messages');
  pane.replaceChildren();
  for(let m of items){
    let d=document.createElement('div');
    d.className='msg'+(m.user_id===user.id?' mine':'');
    let n=document.createElement('div');
    n.className='name';
    n.textContent=m.clubhuis_members?.display_name||'Lid';
    let b=document.createElement('div');
    b.textContent=m.message;
    d.append(n,b);
    pane.append(d);
  }
  pane.scrollTop=pane.scrollHeight;
}

async function load(){
  if(!user)return;
  let {data,error}=await supabase
    .from('clubhuis_messages')
    .select('id,user_id,message,created_at,clubhuis_members(display_name)')
    .order('id',{ascending:true})
    .limit(200);
  if(error){
    note('Berichten laden mislukt: '+error.message);
    return;
  }
  render(data||[]);
}

async function show(){
  let {data:{user:u}}=await supabase.auth.getUser();
  user=u;
  $('auth').style.display=u?'none':'block';
  $('chat').style.display=u?'flex':'none';
  $('logout').hidden=!u;
  clearInterval(timer);
  if(u){
    await load();
    timer=setInterval(load,4000);
  }else note('');
}

$('login').onclick=async()=>{
  note('Inloggen...');
  let {error}=await supabase.auth.signInWithPassword({
    email:$('email').value.trim(),
    password:$('password').value
  });
  if(error){
    note(error.message);
    return;
  }
  note('');
  $('password').value='';
  await show();
};

$('logout').onclick=async()=>{
  await supabase.auth.signOut();
  await show();
};

$('send').onsubmit=async e=>{
  e.preventDefault();
  let msg=$('message').value.trim();
  if(!msg||!user)return;
  let {error}=await supabase
    .from('clubhuis_messages')
    .insert({user_id:user.id,message:msg});
  if(error){
    note('Versturen mislukt: '+error.message);
    return;
  }
  $('message').value='';
  note('');
  await askClubhuisAI(msg);
  await load();
};

document.querySelectorAll('[data-mention]').forEach(
  btn=>btn.addEventListener('click',()=>{
    const input=$('message');
    input.value+=(
      input.value&&!input.value.endsWith(' ')?' ':''
    )+btn.dataset.mention;
    input.focus();
  })
);

let aiBusy = false;

async function askClubhuisAI(message) {
  if (aiBusy) return;
  // if (Math.random() > 0.65) return;

  aiBusy = true;

  const character = Math.random() < 0.5
    ? "nova"
    : "dex";

  try {
    const { data: { session } } =
      await supabase.auth.getSession();

    if (!session) return;

    const { data, error } =
      await supabase.functions.invoke(
        "dynamic-endpoint",
        {
          body: {
            character,
            message
          }
        }
      );

    if (error) throw error;

    if (!data?.reply) return;

    const box = document.createElement("div");
    box.className = "msg botmsg";

    const name = document.createElement("div");
    name.className = "name";
    name.textContent = character === "nova"
      ? "💜 Nova"
      : "🤖 Dex";

    const reply = document.createElement("div");
    reply.textContent = data.reply;

    box.append(name, reply);
    $("messages").append(box);
    box.scrollIntoView({ behavior: "smooth" });

  } catch (error) {
    console.error("AI-fout:", error);
    note("AI-reactie mislukt. Controleer de functie.");
  } finally {
    aiBusy = false;
  }
}

await show();
</script>
</body>
</html>
