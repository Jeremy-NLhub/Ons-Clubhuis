
<!doctype html>
<html lang="nl">
<head>
<meta charset="utf-8">
<meta name="viewport"
content="width=device-width,initial-scale=1">
<title>Ons Clubhuis 💜</title>

<style>
:root{
  font-family:system-ui,Arial;
  color:#f7f3ff;
  background:#151120
}
*{box-sizing:border-box}
body{margin:0}
main{
  max-width:760px;
  margin:auto;
  height:100dvh;
  display:flex;
  flex-direction:column
}
header{
  background:#30243e;
  padding:17px 20px
}
h1{font-size:23px;margin:0}
small{color:#d2c7db}
#auth{
  margin:10vh auto;
  padding:25px;
  max-width:400px;
  width:94%;
  background:#30243e;
  border-radius:18px
}
input,button{
  font:inherit;
  border-radius:10px;
  padding:13px;
  border:0
}
input{
  width:100%;
  margin:7px 0;
  background:#fff;
  color:#21182b
}
button{
  cursor:pointer;
  background:#a781e8;
  color:#1a1025;
  font-weight:700
}
button:disabled{
  opacity:.55;
  cursor:wait
}
#auth button{
  width:100%;
  margin-top:10px
}
#chat{
  display:none;
  flex:1;
  min-height:0;
  flex-direction:column
}
#messages{
  overflow:auto;
  flex:1;
  padding:16px;
  display:flex;
  flex-direction:column;
  gap:12px
}
.msg{
  max-width:85%;
  padding:12px 15px;
  border-radius:16px;
  background:#382e45;
  align-self:flex-start;
  overflow-wrap:anywhere;
  white-space:pre-wrap
}
.mine{
  align-self:flex-end;
  background:#63458c
}
.name{
  font-size:12px;
  color:#e5c9ff;
  margin-bottom:4px
}
form{
  display:flex;
  gap:8px;
  padding:12px;
  background:#30243e
}
form input{
  margin:0;
  flex:1;
  min-width:0
}
#notice{
  padding:8px 15px;
  color:#ffcfaf;
  font-size:13px;
  min-height:28px
}
#logout{
  float:right;
  padding:7px 10px;
  background:#ddd
}
footer{
  padding:5px 14px;
  font-size:11px;
  color:#bfb3cc
}
#bots{
  padding:12px 15px;
  color:#d2c7db;
  font-size:13px;
  background:#211a2d
}
.botbar{
  display:flex;
  gap:8px;
  flex-wrap:wrap;
  margin-top:9px
}
.botpill{
  background:#49345f;
  color:#fff;
  border:1px solid #765a95;
  border-radius:20px;
  padding:8px 11px;
  font-size:12px
}
.botmsg{background:#2e3c58}
.botmsg.nova{background:#493044}
.hint{
  font-size:11px;
  color:#d2c7db;
  margin-top:7px
}
</style>
</head>

<body>
<main>

<header>
<button id="logout" hidden>Uitloggen</button>
<h1>💜 Ons Clubhuis</h1>
<small>Jeremy • Karina • Nova • Dex</small>
</header>

<section id="auth">
<h2>Welkom terug 👋</h2>
<p>Log in met je Clubhuis-account.</p>

<input id="email" type="email"
placeholder="E-mailadres"
autocomplete="username">

<input id="password" type="password"
placeholder="Wachtwoord"
autocomplete="current-password">

<button id="login">Inloggen</button>
</section>

<section id="chat">

<div id="bots">
🤖 <strong>Onze AI-vrienden</strong>

<div class="botbar">
<button type="button"
class="botpill" data-mention="@Nova ">
💜 Nova
</button>

<button type="button"
class="botpill" data-mention="@Dex ">
🤖 Dex
</button>
</div>

<div class="hint">
Nova en Dex praten regelmatig mee
en reageren soms op elkaar. 😂
</div>
</div>

<div id="messages"></div>

<form id="send">
<input id="message" maxlength="2000"
placeholder="Typ een bericht..." required>
<button id="sendbutton">Verstuur</button>
</form>

</section>

<div id="notice" role="status"></div>

<footer>
Alleen goedgekeurde leden kunnen
berichten lezen en sturen.
</footer>

</main>

<script type="module">
import {createClient}
from 'https://esm.sh/@supabase/supabase-js@2';

const supabase=createClient(
  'https://crfvjukxqkgmvfjqmhza.supabase.co',
  'sb_publishable_CWrMrWdu4c4T6yJsspklSQ_FLg2y-f4'
);

const $=id=>document.getElementById(id);

let user=null;
let timer=null;
let sending=false;
let lastRenderKey='';

function note(s){
  $('notice').textContent=s||'';
}

function render(items){
  const key=items.map(m=>m.id).join(',');
  if(key===lastRenderKey)return;
  lastRenderKey=key;

  const pane=$('messages');
  const atBottom=
    pane.scrollHeight-
    pane.scrollTop-
    pane.clientHeight<110;

  pane.replaceChildren();

  for(const m of items){
    const d=document.createElement('div');

    d.className='msg'+(
      m.bot_name
        ?' botmsg '+m.bot_name
        :(m.user_id===user.id?' mine':'')
    );

    const n=document.createElement('div');
    n.className='name';

    n.textContent=
      m.bot_name==='nova'
        ?'💜 Nova'
        :m.bot_name==='dex'
        ?'🤖 Dex'
        :m.clubhuis_members?.display_name||'Lid';

    const b=document.createElement('div');
    b.textContent=m.message;

    d.append(n,b);
    pane.append(d);
  }

  if(atBottom||items.length<=10){
    pane.scrollTop=pane.scrollHeight;
  }
}

async function load(){
  if(!user)return;

  const {data,error}=await supabase
    .from('clubhuis_messages')
    .select(
      'id,user_id,message,bot_name,created_at,clubhuis_members(display_name)'
    )
    .order('id',{ascending:false})
    .limit(200);

  if(error){
    note('Berichten laden mislukt: '+error.message);
    return;
  }

  render((data||[]).reverse());
}

async function show(){
  const {data:{user:u}}=
    await supabase.auth.getUser();

  user=u;

  $('auth').style.display=u?'none':'block';
  $('chat').style.display=u?'flex':'none';
  $('logout').hidden=!u;

  clearInterval(timer);
  lastRenderKey='';

  if(u){
    await load();
    timer=setInterval(load,4000);
  }else{
    note('');
  }
}

$('login').onclick=async()=>{
  note('Inloggen...');

  const {error}=
    await supabase.auth.signInWithPassword({
      email:$('email').value.trim(),
      password:$('password').value
    });

  if(error){
    note(error.message);
    return;
  }

  $('password').value='';
  note('');
  await show();
};

$('logout').onclick=async()=>{
  await supabase.auth.signOut();
  await show();
};

async function askAI(character,rootId,parentId){
  const {data,error}=
    await supabase.functions.invoke(
      'dynamic-endpoint',
      {
        body:{
          character,
          message_id:rootId,
          parent_id:parentId
        }
      }
    );

  if(error)throw error;
  if(data?.error)throw new Error(data.error);

  return data;
}

async function startConversation(messageId,msg){

  const nova=/(^|\s)@nova\b/i.test(msg);
  const dex=/(^|\s)@dex\b/i.test(msg);

  // 90% kans op spontane AI-reactie.
  if(!nova&&!dex&&Math.random()>=0.90){
    return;
  }

  let character=nova
    ?'nova'
    :dex
    ?'dex'
    :Math.random()<0.5
    ?'nova'
    :'dex';

  let parentId=messageId;

  // Kans dat het gesprek doorgaat na
  // respectievelijk 1, 2 en 3 AI-reacties.
  const continueChance=[0.70,0.40,0.40];

  for(let turn=0;turn<4;turn++){

    let response;

    try{
      response=await askAI(
        character,
        messageId,
        parentId
      );
    }catch(error){
      console.error('AI-reactie:',error);
      note('Een AI-reactie is niet gelukt.');
      break;
    }

    if(!response?.id||response.skipped){
      break;
    }

    await load();

    parentId=response.id;

    if(
      turn===3 ||
      Math.random()>=continueChance[turn]
    ){
      break;
    }

    character=character==='nova'?'dex':'nova';
  }
}

$('send').onsubmit=async e=>{
  e.preventDefault();

  const msg=$('message').value.trim();

  if(!msg||!user||sending)return;

  sending=true;
  $('sendbutton').disabled=true;

  try{
    const {data,error}=await supabase
      .from('clubhuis_messages')
      .insert({
        user_id:user.id,
        message:msg
      })
      .select('id')
      .single();

    if(error)throw error;

    $('message').value='';
    note('');
    await load();

    await startConversation(data.id,msg);

  }catch(error){
    note('Versturen mislukt: '+error.message);
  }finally{
    sending=false;
    $('sendbutton').disabled=false;
  }
};

document
  .querySelectorAll('[data-mention]')
  .forEach(btn=>{
    btn.addEventListener('click',()=>{
      const input=$('message');

      input.value+=(
        input.value&&
        !input.value.endsWith(' ')
          ?' '
          :''
      )+btn.dataset.mention;

      input.focus();
    });
  });

await show();
</script>
</body>
</html>
