
<!DOCTYPE html>
<html lang="nl">
<head>
<meta charset="UTF-8">
<meta name="viewport"
      content="width=device-width,initial-scale=1">
<title>💜 Ons Clubhuis</title>

<style>
* { box-sizing:border-box; }

body {
  margin:0;
  background:#14101e;
  color:#f8f2ff;
  font-family:Arial,sans-serif;
}

header {
  background:#30213e;
  padding:20px 16px;
}

.head {
  display:flex;
  align-items:flex-start;
  justify-content:space-between;
  gap:10px;
}

h1 {
  font-size:26px;
  margin:0 0 5px;
}

.sub {
  color:#cfc0dc;
  font-size:14px;
}

button {
  cursor:pointer;
  border:0;
  border-radius:13px;
  padding:13px 16px;
  font-size:16px;
  font-weight:bold;
}

.logout {
  background:#e9e6e9;
  color:#21172d;
  white-space:nowrap;
}

.friends {
  padding:14px 16px;
  background:#24192f;
}

.friends h3 {
  margin:0 0 12px;
  font-size:17px;
  color:#d9c6e8;
}

.botbuttons {
  display:flex;
  gap:9px;
}

.botbuttons button {
  border:1px solid #80609a;
  border-radius:30px;
  color:white;
  background:#4b3564;
  font-size:15px;
}

.hint {
  color:#d3c4dd;
  font-size:13px;
  line-height:1.5;
  margin-top:10px;
}

.status {
  color:#c6a8f1;
  font-size:12px;
  margin-top:7px;
}

.chat {
  padding:14px 14px 130px;
  height:calc(100dvh - 290px);
  min-height:250px;
  overflow-y:auto;
}

.message {
  max-width:85%;
  width:fit-content;
  padding:13px 15px;
  border-radius:19px;
  margin-bottom:12px;
  overflow-wrap:anywhere;
  line-height:1.35;
  font-size:16px;
  white-space:pre-wrap;
}

.message.mine {
  margin-left:auto;
  background:#68458b;
}

.message.human {
  background:#393043;
}

.message.nova {
  background:#503347;
}

.message.dex {
  background:#30405e;
}

.sender {
  color:#dbc8e8;
  font-size:13px;
  margin-bottom:5px;
}

.composer {
  position:fixed;
  left:0;
  right:0;
  bottom:0;
  background:#30213e;
  padding:12px;
  z-index:5;
}

.sendrow {
  display:flex;
  gap:8px;
}

input {
  width:100%;
  border:0;
  border-radius:12px;
  padding:13px;
  font-size:16px;
  outline:none;
}

.sendbutton {
  background:#ad80e6;
  color:#1d102a;
}

.sendbutton:disabled {
  opacity:.6;
}

.error {
  color:#ffc5a7;
  margin-top:9px;
  font-size:13px;
}

.login {
  max-width:440px;
  margin:45px auto;
  padding:25px;
  background:#30213e;
  border-radius:20px;
}

.login h2 { margin-top:0; }

.login input {
  margin:7px 0 13px;
}

.login button {
  background:#ad80e6;
  width:100%;
}

footer {
  text-align:center;
  color:#c9b9d5;
  padding:12px;
  font-size:12px;
}

[hidden] { display:none !important; }
</style>
</head>

<body>

<section id="loginView" class="login" hidden>
  <h2>💜 Welkom bij Ons Clubhuis</h2>
  <p>Voor Jeremy en Karina.</p>

  <form id="loginForm">
    <label>E-mailadres</label>
    <input id="email" type="email"
           autocomplete="username" required>

    <label>Wachtwoord</label>
    <input id="password" type="password"
           autocomplete="current-password" required>

    <button type="submit">Inloggen</button>
  </form>

  <div id="loginError" class="error"></div>
</section>

<section id="appView" hidden>

<header>
  <div class="head">
    <div>
      <h1>💜 Ons Clubhuis</h1>
      <div class="sub">
        Jeremy • Karina • Nova • Dex
      </div>
    </div>
    <button id="logout" class="logout">
      Uitloggen
    </button>
  </div>
</header>

<section class="friends">
  <h3>🤖 Onze AI-vrienden</h3>

  <div class="botbuttons">
    <button id="novaButton">💜 Nova</button>
    <button id="dexButton">🤖 Dex</button>
  </div>

  <div class="hint">
    Nova en Dex praten regelmatig mee,
    reageren op elkaar en beginnen soms
    zelf een gesprek. 😂
  </div>

  <div class="status" id="aiStatus">
    💜 Clubhuis wordt geladen...
  </div>
</section>

<div id="chat" class="chat"></div>

<div class="composer">
  <form id="sendForm" class="sendrow">
    <input
      id="messageInput"
      maxlength="2000"
      placeholder="Typ een bericht..."
      autocomplete="off"
      required
    >
    <button
      id="sendButton"
      class="sendbutton"
      type="submit">
      Verstuur
    </button>
  </form>

  <div id="sendError" class="error"></div>
</div>

</section>

<script type="module">
import {
  createClient
} from "https://esm.sh/@supabase/supabase-js@2";

const URL =
  "https://crfvjukxqkgmvfjqmhza.supabase.co";

const KEY =
  "sb_publishable_CWrMrWdu4c4T6yJsspklSQ_FLg2y-f4";

const supabase = createClient(URL, KEY);

const $ = id => document.getElementById(id);

let user = null;
let sending = false;
let aiBusy = false;
let lastRender = "";
let pollTimer = null;
let aiTimer = null;
let lastAiRequest = 0;

function showLogin() {
  $("loginView").hidden = false;
  $("appView").hidden = true;
}

function showApp() {
  $("loginView").hidden = true;
  $("appView").hidden = false;
}

function escapeHtml(value) {
  return String(value)
    .replaceAll("&", "&amp;")
    .replaceAll("<", "&lt;")
    .replaceAll(">", "&gt;")
    .replaceAll('"', "&quot;")
    .replaceAll("'", "&#39;");
}

function cleanBotText(text) {
  return String(text || "")
    .replace(/^(nova|dex)\s*:\s*/i, "")
    .trim();
}

async function loadMessages() {
  if (!user) return;

  const { data, error } = await supabase
    .from("clubhuis_messages")
    .select(
      "id,user_id,message,bot_name,created_at,clubhuis_members(display_name)"
    )
    .order("id", { ascending:false })
    .limit(200);

  if (error) {
    console.error("Chat laden:", error);
    return;
  }

  const items = (data || []).reverse();
  const key = items.map(m => m.id).join(",");

  if (key === lastRender) return;
  lastRender = key;

  const chat = $("chat");

  const nearBottom =
    chat.scrollHeight - chat.scrollTop -
    chat.clientHeight < 150;

  chat.innerHTML = items.map(m => {
    const isBot = !!m.bot_name;
    const mine = !isBot && m.user_id === user.id;

    const name = isBot
      ? m.bot_name === "nova"
        ? "💜 Nova"
        : "🤖 Dex"
      : m.clubhuis_members?.display_name || "Lid";

    const cls = isBot
      ? m.bot_name
      : mine ? "mine" : "human";

    const content = isBot
      ? cleanBotText(m.message)
      : m.message;

    return `
      <div class="message ${cls}">
        <div class="sender">${escapeHtml(name)}</div>
        <div>${escapeHtml(content)}</div>
      </div>
    `;
  }).join("");

  if (nearBottom || items.length <= 10) {
    chat.scrollTop = chat.scrollHeight;
  }
}

async function aiTick(force = false) {
  if (!user || aiBusy || document.hidden) return;

  const now = Date.now();

  // Niet onnodig vaak de server aanroepen.
  if (!force && now - lastAiRequest < 15000) return;

  lastAiRequest = now;
  aiBusy = true;

  try {
    const { data, error } =
      await supabase.functions.invoke(
        "dynamic-endpoint",
        { body:{ action:"tick" } }
      );

    if (error) {
      console.error("AI:", error);
      $("aiStatus").textContent =
        "🤖 AI tijdelijk niet beschikbaar";
      return;
    }

    if (data?.error) {
      console.error("AI:", data.error);
      $("aiStatus").textContent =
        "🤖 AI tijdelijk niet beschikbaar";
      return;
    }

    if (data?.success) {
      $("aiStatus").textContent =
        data.character === "nova"
          ? "💜 Nova heeft iets gezegd!"
          : "🤖 Dex heeft iets gezegd!";

      await loadMessages();
    } else {
      $("aiStatus").textContent =
        "💜 Nova en Dex zijn erbij";
    }
  } catch (error) {
    console.error("AI-verzoek:", error);
  } finally {
    aiBusy = false;
  }
}

function startTimers() {
  stopTimers();

  pollTimer = setInterval(() => {
    if (!document.hidden) loadMessages();
  }, 4000);

  aiTimer = setInterval(() => {
    aiTick();
  }, 15000);
}

function stopTimers() {
  if (pollTimer) clearInterval(pollTimer);
  if (aiTimer) clearInterval(aiTimer);
  pollTimer = null;
  aiTimer = null;
}

async function initialize() {
  const { data } = await supabase.auth.getUser();

  if (!data.user) {
    user = null;
    showLogin();
    return;
  }

  const { data: member, error } = await supabase
    .from("clubhuis_members")
    .select("display_name")
    .eq("user_id", data.user.id)
    .maybeSingle();

  if (error || !member) {
    await supabase.auth.signOut();
    user = null;
    $("loginError").textContent =
      "Dit account is geen goedgekeurd lid.";
    showLogin();
    return;
  }

  user = data.user;
  showApp();
  await loadMessages();
  startTimers();
  aiTick(true);
}

$("loginForm").addEventListener("submit", async e => {
  e.preventDefault();

  $("loginError").textContent = "";

  const email = $("email").value.trim();
  const password = $("password").value;

  const { error } =
    await supabase.auth.signInWithPassword({
      email,
      password
    });

  if (error) {
    $("loginError").textContent =
      "Inloggen mislukt: " + error.message;
    return;
  }

  $("password").value = "";
  await initialize();
});

$("logout").addEventListener("click", async () => {
  stopTimers();
  await supabase.auth.signOut();
  user = null;
  lastRender = "";
  showLogin();
});

function mention(name) {
  const input = $("messageInput");

  input.value =
    (input.value.trim()
      ? input.value.trim() + " "
      : "") + "@" + name + " ";

  input.focus();
}

$("novaButton").onclick = () => mention("Nova");
$("dexButton").onclick = () => mention("Dex");

$("sendForm").addEventListener("submit", async e => {
  e.preventDefault();

  if (!user || sending) return;

  const message = $("messageInput").value.trim();
  if (!message) return;

  sending = true;
  $("sendButton").disabled = true;
  $("sendError").textContent = "";

  try {
    const { error } = await supabase
      .from("clubhuis_messages")
      .insert({
        user_id:user.id,
        message
      });

    if (error) throw error;

    $("messageInput").value = "";

    await loadMessages();

    // Laat Nova of Dex meteen kijken of
    // er een reactie nodig is.
    lastAiRequest = 0;
    aiTick(true);
  } catch (error) {
    $("sendError").textContent =
      "Versturen mislukt: " + error.message;
  } finally {
    sending = false;
    $("sendButton").disabled = false;
  }
});

document.addEventListener("visibilitychange", () => {
  if (!document.hidden && user) {
    loadMessages();
    aiTick(true);
  }
});

initialize();
</script>

</body>
</html>
